version: '3.8'

services:
  openvpn-client:
    build:
      context: ./openvpn-client
      dockerfile: Dockerfile
    container_name: openvpn-client
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./config:/config:ro
    environment:
      - OPENVPN_CONFIG=/config/client.ovpn
      - OPENVPN_ARGS=
    restart: unless-stopped
    networks:
      - app-network
    sysctls:
      - net.ipv4.ip_forward=1

  django-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django
    ports:
      - "8081:3000"
    volumes:
      - .:/app
      - django-static:/app/staticfiles
      - django-media:/app/media
    env_file:
      - .env
    environment:
      # Django settings
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-this-in-production}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - DJANGO_PORT=${DJANGO_PORT:-3000}
      # MySQL на бэкенде (локально или через VPN)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      # Backend API (локально или через VPN)
      - PYTHON_API_URL=${PYTHON_API_URL:-http://host.docker.internal:8000}
      - PYTHON_API_URL_FALLBACK=${PYTHON_API_URL_FALLBACK:-}
      # VPN Gateway (используем DNS-имя контейнера)
      - VPN_GATEWAY=${VPN_GATEWAY:-openvpn-client}
      # VPN Routes (подсети для маршрутизации через VPN, через запятую)
      - VPN_ROUTES=${VPN_ROUTES:-}
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      - openvpn-client
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  django-static:
  django-media:
